name: Dev Build

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dev:
    name: Windows dev build (DEBUG)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Download bundled ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          $zip = "C:\Windows\Temp\ffmpeg.zip"
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $maxRetries = 3
          $retryDelay = 10
          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              Write-Host "Downloading ffmpeg (attempt $i of $maxRetries)..."
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 120
              break
            } catch {
              Write-Warning "Download failed: $_"
              if ($i -eq $maxRetries) { throw "Failed to download ffmpeg after $maxRetries attempts" }
              Start-Sleep -Seconds $retryDelay
            }
          }
          Expand-Archive -Path $zip -DestinationPath src-tauri/resources/temp -Force
          $exe = Get-ChildItem -Path src-tauri/resources/temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName src-tauri/resources/ffmpeg.exe -Force }
          Remove-Item -Path src-tauri/resources/temp -Recurse -Force -ErrorAction SilentlyContinue
          ls src-tauri/resources/ffmpeg.exe || Write-Host "ffmpeg not bundled"

      - name: Build dev bundle (DEBUG)
        working-directory: src-tauri
        run: cargo tauri build --target x86_64-pc-windows-msvc --debug

      - name: Upload dev artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duetplay-dev-windows
          path: src-tauri/target/x86_64-pc-windows-msvc/debug/bundle/**/*
