name: Dev Build

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dev:
    name: Windows dev build (DEBUG)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build dev bundle (DEBUG)
        working-directory: src-tauri
        run: cargo tauri build --target x86_64-pc-windows-msvc --debug

      - name: Upload dev artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duetplay-dev-windows
          path: src-tauri/target/x86_64-pc-windows-msvc/debug/bundle/**/*
