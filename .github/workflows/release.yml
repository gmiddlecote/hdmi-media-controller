name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Download bundled ffmpeg (Windows static)
        run: |
          mkdir -p src-tauri/resources
          # Download static build zip; extract ffmpeg.exe
          curl -L -o /tmp/ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.0-latest-win64-gpl-7.0.zip"
          # BtbN zips contain bin/ffmpeg.exe; extract just that
          if command -v unzip >/dev/null 2>&1; then
            unzip -j /tmp/ffmpeg.zip "bin/ffmpeg.exe" -d src-tauri/resources/ || true
          else
            # Fallback: try direct binary URL (some mirrors provide .exe)
            curl -L -o src-tauri/resources/ffmpeg.exe "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg.exe" || true
          fi
          ls -la src-tauri/resources/ffmpeg.exe || echo "ffmpeg.exe not bundled (build uses system fallback)"

      - name: Build and bundle (MSI + NSIS)
        working-directory: src-tauri
        run: cargo tauri build --target x86_64-pc-windows-msvc --ci

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe