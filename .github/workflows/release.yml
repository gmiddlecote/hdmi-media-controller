name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Download bundled ffmpeg (Windows static)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          $zip = "C:\tmp\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.0-latest-win64-gpl-7.0.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath src-tauri/resources/temp -Force
          $exe = Get-ChildItem -Path src-tauri/resources/temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName src-tauri/resources/ffmpeg.exe -Force }
          Remove-Item -Path src-tauri/resources/temp -Recurse -Force -ErrorAction SilentlyContinue
          ls src-tauri/resources/ffmpeg.exe || Write-Host "ffmpeg not bundled; build uses system fallback"

      - name: Build and bundle (MSI + NSIS)
        working-directory: src-tauri
        run: cargo tauri build --target x86_64-pc-windows-msvc --ci

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe