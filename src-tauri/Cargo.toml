[package]
name = "hdmi-media-controller"
version = "0.2.3"
description = "Windows desktop app to control media playback on external HDMI displays"
edition = "2021"

[lib]
name = "hdmi_media_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true