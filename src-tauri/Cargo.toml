[package]
name = "hdmi-media-controller"
version = "0.24.0"
description = "Windows desktop app to control media playback on external HDMI displays"
edition = "2021"

[[bin]]
name = "hdmi-media-controller"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
] }
winreg = "0.55"
glium = "0.32"
image = "0.25"
ab_glyph = "0.2"
ttf-parser = "0.25"

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
