<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HDMI Media Output</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        font: 14px/1.6 system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #stage.media {
        padding: 0;
      }
      #stage.pre-line {
        white-space: pre-line;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 13px;
        text-align: left;
      }
      img,
      video {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        background: #000;
        animation: media-fade 0.5s ease both;
      }
      @keyframes media-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .overlay {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 28px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font: 500 17px/1.4 system-ui, sans-serif;
        text-align: center;
        animation: media-fade 0.3s ease both;
      }
    </style>
  </head>
  <body>
    <div id="stage">No media assigned to this output.</div>
    <script>
      (function () {
        const core = window.__TAURI__.core;
        const event = window.__TAURI__.event;
        const stage = document.getElementById("stage");
        const label = window.__TAURI__.webview.getCurrentWebview().label;

        function fail(message) {
          stage.className = "pre-line";
          stage.textContent = message;
        }

        function failWithDiagnostics(base) {
          core
            .invoke("media_probe", { url: payload.mediaUrl })
            .then(function (probe) {
              fail(
                base +
                  "\nURL: " + probe.url +
                  "\nid: " + (probe.id === null ? "none" : String(probe.id)) +
                  "  registered: " + probe.registered +
                  "  kind: " + (probe.kind || "unknown") +
                  "  mime: " + (probe.mime || "unknown") +
                  "\npath: " + (probe.path || "none") +
                  "\nexists: " + probe.exists +
                  "  size: " + (probe.size === null ? "unknown" : probe.size + " bytes")
              );
            })
            .catch(function () {
              fail(base);
            });
        }

        function setOverlay(text) {
          let el = stage.querySelector(".overlay");
          if (!text) {
            if (el) el.remove();
            return;
          }
          if (!el) {
            el = document.createElement("div");
            el.className = "overlay";
            stage.append(el);
          }
          el.textContent = String(text);
        }

        core
          .invoke("renderer_render_token", { label })
          .then(function (payload) {
            document.title = "HDMI Media Output \u2014 " + (payload.title || "");
            setOverlay(payload.overlay || "");

            if (payload.kind === "video") {
              const video = document.createElement("video");
              video.autoplay = true;
              video.muted = true;
              video.playsInline = true;
              video.preload = "auto";
              video.addEventListener("ended", function () {
                event.emit("render-finished", {});
              });
              video.addEventListener("timeupdate", function () {
                if (!video.duration || video.duration === Infinity) return;
                event.emit("media-progress", {
                  current: video.currentTime,
                  duration: video.duration,
                });
              });
              video.addEventListener("error", function () {
                failWithDiagnostics("Video could not be decoded: " + (payload.title || payload.mediaUrl));
              });
              video.src = payload.mediaUrl;
              stage.className = "media";
              stage.append(video);
              video.play().catch(function () {});

              // Browsers block autoplay with sound; also try on first click.
              document.addEventListener("click", function play() {
                video.play().catch(function () {});
              });
            } else {
              const img = document.createElement("img");
              img.alt = "";
              img.addEventListener("error", function () {
                failWithDiagnostics("Image could not be decoded: " + (payload.title || payload.mediaUrl));
              });
              img.src = payload.mediaUrl;
              stage.className = "media";
              stage.append(img);
            }
          })
          .catch(function (err) {
            fail("No media assigned: " + String(err));
          });

        event.listen("overlay-text", function (evt) {
          setOverlay(evt.payload);
        });

        event.listen("output-control", function (evt) {
          const video = stage.querySelector("video");
          if (!video) return;
          if (evt.payload === true) {
            video.pause();
          } else {
            video.play().catch(function () {});
          }
        });
      })();
    </script>
  </body>
</html>
