<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DuetPlay Output</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #98a2b0;
        font: 14px/1.6 "Segoe UI", system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #stage.media {
        padding: 0;
      }
      #stage.pre-line {
        display: block;
        padding: 24px 32px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        text-align: left;
        font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
        font-size: 13px;
        line-height: 1.55;
        color: #b9c2cd;
      }
      #stage.media img,
      #stage.media video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
        animation: media-fade 0.45s ease both;
      }
      @keyframes media-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .overlay {
        position: absolute;
        z-index: 10;
        left: 20px;
        right: auto;
        top: auto;
        bottom: 20px;
        width: max-content;
        max-width: calc(100% - 40px);
        box-sizing: border-box;
        padding: 10px 20px;
        border-radius: 10px;
        background: rgba(6, 9, 13, 0.74);
        box-shadow: 0 6px 28px rgba(0, 0, 0, 0.45);
        color: #f4f7fa;
        font: 500 17px/1.45 "Segoe UI", system-ui, sans-serif;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        animation: media-fade 0.3s ease both;
      }
      .overlay.top {
        top: 20px;
        bottom: auto;
      }
      .overlay.bottom {
        bottom: 20px;
        top: auto;
      }
      .overlay.left {
        left: 20px;
        right: auto;
        text-align: left;
      }
      .overlay.center {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        text-align: center;
      }
      .overlay.right {
        left: auto;
        right: 20px;
        text-align: right;
      }
      .audio-title {
        font: 600 26px/1.4 "Segoe UI", system-ui, sans-serif;
        color: #e8eef4;
        max-width: 80%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        animation: media-fade 0.5s ease both;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      (function () {
        var stage = document.getElementById("stage");

        function fail(message) {
          stage.className = "pre-line";
          stage.textContent = message;
        }

        window.addEventListener("error", function (evt) {
          fail("Uncaught error: " + (evt && evt.message ? evt.message : String(evt)));
          logJsError(evt && evt.message ? evt.message : String(evt));
        });
        window.addEventListener("unhandledrejection", function (evt) {
          fail("Unhandled rejection: " + (evt && evt.reason ? String(evt.reason) : String(evt)));
          logJsError(evt && evt.reason ? String(evt.reason) : String(evt));
        });

        function logJsError(message) {
          try {
            core.invoke("log_js_error", { message: "[render] " + String(message) }).catch(function () {});
          } catch (_) {}
        }

        fail("Initialising output window...");
        if (!window.__TAURI__) {
          fail("Fatal: Tauri API was not injected (window.__TAURI__ missing).");
          return;
        }

        var core = window.__TAURI__.core;
        var event = window.__TAURI__.event;

        document.addEventListener("keydown", function (keyEvent) {
          if (keyEvent.key !== "Escape" || keyEvent.repeat) return;
          keyEvent.preventDefault();
          core.invoke("scheduler_stop").catch(function () {});
        });

        var label;
        try {
          label = window.__TAURI__.window.getCurrentWindow().label;
        } catch (_) {
          label = window.__TAURI__.webview.getCurrentWebview().label;
        }

        fail("Output window ready (" + label + ")...");

        function failWithDiagnostics(base, mediaUrl) {
          core
            .invoke("media_probe", { url: mediaUrl })
            .then(function (probe) {
              var detail =
                base +
                "\nURL: " + probe.url +
                "\nid: " + (probe.id === null ? "none" : String(probe.id)) +
                "  registered: " + probe.registered +
                "  kind: " + (probe.kind || "unknown") +
                "  mime: " + (probe.mime || "unknown") +
                "\npath: " + (probe.path || "none") +
                "\nexists: " + probe.exists +
                "  size: " + (probe.size === null ? "unknown" : probe.size + " bytes");
              fail(detail);
              logJsError(detail);
            })
            .catch(function () {
              fail(base);
              logJsError(base);
            });
        }

        function setOverlay(text, v, h) {
          v = v || "bottom";
          h = h || "left";
          let el = stage.querySelector(".overlay");
          if (!text) {
            if (el) el.remove();
            return;
          }
          if (!el) {
            el = document.createElement("div");
            el.className = "overlay";
            stage.append(el);
          }
          el.textContent = String(text);
          el.classList.remove("top", "bottom", "left", "center", "right");
          el.classList.add(v, h);
        }

        function applyFit(fit) {
          const media = stage.querySelector("img, video");
          if (media && (fit === "contain" || fit === "cover")) {
            media.style.objectFit = fit;
          }
        }

        // Applies the shared output volume to a freshly created media element.
        function applyVolume(media) {
          core
            .invoke("renderer_volume")
            .then(function (level) {
              media.volume = level;
            })
            .catch(function () {});
        }

        // Last resort for an orphaned output window: close it from the webview.
        function closeSelf() {
          try {
            window.__TAURI__.window.getCurrentWindow().close();
          } catch (_) {}
        }

        core
          .invoke("renderer_render_token", { label })
          .then(function (payload) {
            stage.textContent = "";
            document.title = "DuetPlay Output \u2014 " + (payload.title || "");
            setOverlay(payload.overlay || "", payload.overlay_v || "bottom", payload.overlay_h || "left");

            if (payload.kind === "video") {
              const video = document.createElement("video");
              video.autoplay = true;
              video.playsInline = true;
              video.preload = "auto";
              video.addEventListener("ended", function () {
                event.emit("render-finished", {});
              });
              video.addEventListener("timeupdate", function () {
                if (!video.duration || video.duration === Infinity) return;
                event.emit("media-progress", {
                  current: video.currentTime,
                  duration: video.duration,
                });
              });
              video.addEventListener("error", function () {
                failWithDiagnostics("Video could not be decoded: " + (payload.title || payload.mediaUrl), payload.mediaUrl);
              });
              video.src = payload.mediaUrl;
              stage.className = "media";
              stage.append(video);
              applyFit(payload.fit);
              applyVolume(video);
              video.play().catch(function () {});

              // Fallback: if the webview still blocks autoplay with sound, start on
              // the first click.
              document.addEventListener("click", function play() {
                video.play().catch(function () {});
              });
            } else if (payload.kind === "audio") {
              const title = document.createElement("div");
              title.className = "audio-title";
              title.textContent = payload.title || "";
              title.title = payload.title || "";
              const audio = document.createElement("audio");
              audio.autoplay = true;
              audio.playsInline = true;
              audio.preload = "auto";
              audio.addEventListener("ended", function () {
                event.emit("render-finished", {});
              });
              audio.addEventListener("timeupdate", function () {
                if (!audio.duration || audio.duration === Infinity) return;
                event.emit("media-progress", {
                  current: audio.currentTime,
                  duration: audio.duration,
                });
              });
              audio.addEventListener("error", function () {
                failWithDiagnostics("Audio could not be played: " + (payload.title || payload.mediaUrl), payload.mediaUrl);
              });
              audio.src = payload.mediaUrl;
              stage.className = "";
              stage.append(title, audio);
              applyVolume(audio);
              audio.play().catch(function () {});
            } else {
              const img = document.createElement("img");
              img.alt = "";
              img.addEventListener("error", function () {
                failWithDiagnostics("Image could not be decoded: " + (payload.title || payload.mediaUrl), payload.mediaUrl);
              });
              img.src = payload.mediaUrl;
              stage.className = "media";
              stage.append(img);
              applyFit(payload.fit);
            }
          })
          .catch(function (err) {
            fail(
              "No media assigned to this window (" +
                label +
                "): " +
                String(err)
            );
            // A real output window always has a session; a window polling without
            // one is a leftover. Keep the error readable briefly, then close
            // it so ghosts do not linger on the output display.
            core.invoke("renderer_close", { label: label }).then(
              function () {
                setTimeout(closeSelf, 20000);
              },
              function () {
                setTimeout(closeSelf, 20000);
              }
            );
          });

        event.listen("overlay-text", function (evt) {
          let p = evt.payload || {};
          if (typeof p === "string") p = { text: p, v_pos: "bottom", h_pos: "left" };
          setOverlay(p.text || p.overlay || "", p.v_pos || "bottom", p.h_pos || "left");
        });

        event.listen("output-volume", function (evt) {
          const media = stage.querySelector("video, audio");
          if (media) media.volume = Number(evt.payload);
        });

        event.listen("fit-updated", function (evt) {
          applyFit(evt.payload);
        });

        event.listen("output-control", function (evt) {
          const media = stage.querySelector("video, audio");
          if (!media) return;
          if (evt.payload === true) {
            media.pause();
          } else {
            media.play().catch(function () {});
          }
        });
      })();
    </script>
  </body>
</html>
