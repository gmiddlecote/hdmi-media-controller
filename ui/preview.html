<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DuetPlay Video Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090c11;
        --surface-1: #101419;
        --surface-2: #151a21;
        --surface-3: #1a2029;
        --surface-hover: #212836;
        --border: #242b36;
        --border-strong: #333c4b;
        --text: #e9edf2;
        --text-2: #98a2b0;
        --text-3: #6e7887;
        --accent: #3ec8e8;
        --accent-dim: rgba(62, 200, 232, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        overflow: hidden;
      }
      .preview-shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 14px 16px;
        gap: 12px;
      }
      .preview-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }
      .preview-header h1 {
        margin: 0 0 3px;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .preview-subtitle {
        color: var(--text-3);
        font-size: 12px;
      }
      .preview-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .preview-actions button {
        min-height: 30px;
        padding: 0 12px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: var(--surface-3);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        transition:
          background-color 0.12s ease,
          border-color 0.12s ease,
          color 0.12s ease,
          transform 0.06s ease;
      }
      .preview-actions button:hover {
        background: var(--surface-hover);
        border-color: #3d4757;
      }
      .preview-actions button:active {
        transform: translateY(1px);
      }
      .preview-actions button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #choose-speaker {
        background: var(--accent-dim);
        border-color: rgba(62, 200, 232, 0.45);
        color: var(--accent);
      }
      #choose-speaker:hover {
        background: rgba(62, 200, 232, 0.2);
        border-color: var(--accent);
      }
      #close-preview {
        background: transparent;
        border-color: transparent;
        color: var(--text-2);
      }
      #close-preview:hover {
        background: var(--surface-2);
        border-color: var(--border);
        color: var(--text);
      }
      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #000;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      #preview-empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--text-3);
        font-size: 13px;
        text-align: center;
      }
      #preview-empty[hidden] {
        display: none;
      }
      .preview-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 18px;
        color: var(--text-3);
        font-size: 11.5px;
      }
      #preview-status {
        color: var(--text-2);
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <header class="preview-header">
        <div>
          <h1 id="preview-title">Video preview</h1>
          <div id="preview-subtitle" class="preview-subtitle">Audio is routed only after a laptop speaker is selected.</div>
        </div>
        <div class="preview-actions">
          <button id="choose-speaker" type="button">Choose laptop speaker</button>
          <button id="close-preview" type="button">Close</button>
        </div>
      </header>
      <section class="stage">
        <video id="preview-video" controls playsinline preload="auto"></video>
        <div id="preview-empty">Choose a video from the playlist to preview it here.</div>
      </section>
      <footer class="preview-footer">
        <span id="preview-status">Waiting for a video.</span>
        <span>Preview audio never changes the system default.</span>
      </footer>
    </main>
    <script src="preview.js" type="module"></script>
  </body>
</html>
